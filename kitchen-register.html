<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodieRest | Kitchen Staff Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="kitchen-register.css">
</head>
<body>

    <div class="auth-page">

        <!-- Bam pash: welcome panel -->
        <section class="auth-left">
            <a href="index.html" class="logo">
                <img src="images/logo.svg" alt="FoodieRest logo">
                <strong>Foodie<span>Rest</span></strong>
            </a>
            <h1>Join<br>FoodieRest</h1>
            <p>Create a staff account to manage cooking</p>
            <ul class="feature-list">
                <li><span class="icon">🥗</span> Fresh Ingredients</li>
                <li><span class="icon">⚡</span> Fast Service</li>
                <li><span class="icon">😋</span> Great Taste</li>
            </ul>
        </section>

        <!-- Dan pash: form -->
        <section class="auth-right">
            <div class="auth-card">
                <span class="role-pill">Kitchen Staff</span>
                <h2>Kitchen Staff Registration</h2>
                <p class="sub">Fill in the form to create your account</p>

                <form onsubmit="return validateRegister('kitchen')" novalidate>
                    <p id="formMessage" class="form-message"></p>
                    <fieldset>
                        <legend>Personal Information</legend>

                        <div class="form-group">
                            <label for="fullName">Full Name</label>
                            <input type="text" id="fullName" name="fullName" placeholder="Enter your name" required>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="email">Email</label>
                                <input type="email" id="email" name="email" placeholder="Enter your email" required>
                            </div>
                            <div class="form-group">
                                <label for="phone">Phone Number</label>
                                <input type="tel" id="phone" name="phone" placeholder="01XXXXXXXXX" pattern="01[0-9]{9}" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Gender</label>
                            <div class="option-group">
                                <label for="male"><input type="radio" id="male" name="gender" value="Male" checked> Male</label>
                                <label for="female"><input type="radio" id="female" name="gender" value="Female"> Female</label>
                                <label for="other"><input type="radio" id="other" name="gender" value="Other"> Other</label>
                            </div>
                        </div>
                    </fieldset>
                    <fieldset>
                        <legend>Account Information</legend>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="employeeId">Employee ID</label>
                                <input type="text" id="employeeId" name="employeeId" placeholder="e.g. KS-1024" required>
                            </div>
                            <div class="form-group">
                                <label for="shift">Work Shift</label>
                                <select id="shift" name="shift" required>
                                    <option value="">-- Select shift --</option>
                                    <option value="morning">Morning (8 AM - 4 PM)</option>
                                    <option value="evening">Evening (4 PM - 12 AM)</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="password">Password</label>
                                <input type="password" id="password" name="password" placeholder="Min 6 characters" minlength="6" required>
                            </div>
                            <div class="form-group">
                                <label for="confirmPassword">Confirm Password</label>
                                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Type again" minlength="6" required>
                            </div>
                        </div>

                        <label class="check-label" for="agree">
                            <input type="checkbox" id="agree" name="agree" value="yes" required> I agree to the terms and conditions
                        </label>
                    </fieldset>

                    <div class="form-buttons">
                        <input type="submit" value="Register" class="btn btn-primary">
                        <input type="reset" value="Reset" class="btn btn-outline">
                    </div>
                </form>

                <p class="auth-switch">
                    Already have an account? <a href="kitchen-login.html">Login here</a>
                </p>
            </div>
        </section>

    </div>

    <script src="storage.js"></script>
    <script src="kitchen-register.js"></script>

</body>
</html>
